<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Achadinhos ranqueados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9edf2;--card:#fff;--ink:#101820;--mute:#5a6675;--line:#cfd6df;--accent:#ee4d2d;--accent-ink:#fff;--rank:#101820;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1218;--card:#17202a;--ink:#f2f5f8;--mute:#9aa7b6;--line:#2a3643;--rank:#f2f5f8}}
:root[data-theme="dark"]{--bg:#0d1218;--card:#17202a;--ink:#f2f5f8;--mute:#9aa7b6;--line:#2a3643;--rank:#f2f5f8}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:28px 16px 48px}
h1{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(40px,12vw,56px);line-height:1;margin:0 0 10px;letter-spacing:.01em}
.lead{margin:0 0 18px;color:var(--mute);max-width:36ch}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 0;background:var(--bg)}
nav a{flex:0 0 auto;min-width:44px;text-align:center;padding:8px 14px;border:2px solid var(--ink);border-radius:999px;color:var(--ink);text-decoration:none;font-family:Anton,Impact,sans-serif;font-size:18px}
nav a:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.list{display:grid;gap:22px;margin-top:14px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;scroll-margin-top:70px}
.item:target{border:2px solid var(--accent)}
.pic{position:relative;aspect-ratio:1/1;background:#000}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.rank{position:absolute;left:0;top:0;padding:4px 16px 0 14px;background:var(--bg);color:var(--rank);font-family:Anton,Impact,sans-serif;font-size:64px;line-height:1.1;border-radius:0 0 14px 0}
.body{padding:16px}
h2{margin:0 0 4px;font-size:20px;line-height:1.25}
.body p{margin:0 0 14px;color:var(--mute)}
.btn{display:block;text-align:center;padding:14px 16px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;text-decoration:none}
.btn:active{transform:scale(.98)}
.empty{padding:24px;text-align:center;color:var(--mute)}
footer{margin-top:28px;font-size:13px;color:var(--mute)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn:active{transform:none}}
</style></head>
